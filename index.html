<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6b55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="크레셀">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head><body>
<title>크레셀 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 왼쪽 화면 목록, 가운데 폰 한 대. 앱 안은 흰 바탕, 먹색 글자, 초록은 가격과 선택에만 */
:root{
  --bg:#eceeed; --fg:#16191b; --muted:#646b6f; --panel:#ffffff; --pline:#d8dcda; --accent:#0f6b55; --chip:#e7ebe9;
  --f-ui:"IBM Plex Sans KR","Pretendard","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121615;--fg:#e7ebe9;--muted:#9aa3a0;--panel:#1b201f;--pline:#2d3533;--accent:#5cc3a2;--chip:#24302c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121615;--fg:#e7ebe9;--muted:#9aa3a0;--panel:#1b201f;--pline:#2d3533;--accent:#5cc3a2;--chip:#24302c;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
.shell{display:grid;grid-template-columns:288px minmax(0,1fr);gap:28px;max-width:1160px;margin:0 auto;padding-block:24px;min-height:100%}
.panel{background:var(--panel);border:1px solid var(--pline);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 48px);position:sticky;top:24px;min-width:0}
.panel h1{font-size:19px;margin:0}
.panel .lead{font-size:12.5px;color:var(--muted);line-height:1.6;margin:6px 0 0}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:8px;padding:3px}
.seg2 button{border:0;background:transparent;padding:7px 6px;font-size:12.5px;color:var(--muted);border-radius:6px;transition:background .15s,color .15s}
.seg2 button[aria-pressed="true"]{background:var(--panel);color:var(--fg);font-weight:600}
.lbl{font-size:11.5px;color:var(--muted);font-weight:600}
.idx{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px;padding-right:4px}
.idx h3{font-size:12px;margin:0 0 4px;color:var(--muted);font-weight:600}
.idx button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:5px 8px;border-radius:6px;font-size:13px;align-items:baseline}
.idx button:hover{background:var(--chip)}
.idx button[aria-current="true"]{background:var(--chip);font-weight:600}
.idx code{font-family:inherit;font-size:11px;color:var(--muted);min-width:30px;font-variant-numeric:tabular-nums}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.cap{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.cap b{color:var(--fg);font-weight:600}
.cap code{font-family:inherit;background:var(--chip);padding:2px 7px;border-radius:5px;color:var(--fg);font-variant-numeric:tabular-nums}
.navbtn{border:1px solid var(--pline);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:12.5px}
.navbtn:focus-visible,.idx button:focus-visible,.seg2 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mobsel{display:none}
/* 앱으로 설치해 열었을 때: 패널과 폰 테두리 없이 화면 전체가 앱 */
html.app,html.app body{margin:0;padding:0;height:100%;overflow:hidden;background:#e9ecea}
html.app .shell{display:block;padding:0;max-width:none;min-height:0}
html.app .panel,html.app .cap{display:none}
html.app .stage{display:block}
html.app .fit{max-width:none;width:auto}
html.app .phone{padding:0;background:transparent;border-radius:0;box-shadow:none}
html.app .scr{border-radius:0}
html.app .scr .sbar{height:max(10px,env(safe-area-inset-top,0px));visibility:hidden}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px;padding-block:12px}
  .panel{position:static;max-height:none}
  .idx{display:none}
  .mobsel{display:block;width:100%;padding:8px;border-radius:8px;border:1px solid var(--pline);background:var(--panel);color:var(--fg);font:inherit}
}

/* ===== 폰 ===== */
.fit{width:390px;max-width:100%}
.phone{width:390px;height:844px;border-radius:50px;background:#101213;padding:10px;box-shadow:0 2px 6px rgba(0,0,0,.18);transform-origin:top left}
.scr{
  --ink:#111418;--ink2:#3c4247;--sub:#767d82;--line:#e7e9e8;--fill:#f3f4f3;--paper:#ffffff;
  --acc:#0f6b55;--warn:#a35a00;--bad:#b3362e;--r:10px;
  position:relative;width:100%;height:100%;border-radius:41px;overflow:hidden;background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;font-family:var(--f-ui);font-size:14px;color-scheme:light;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere
}
.view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.sbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;font-size:14px;font-weight:600}
.sbar .r{display:flex;gap:6px;align-items:center;font-size:12px}
.sbar .bat{width:24px;height:12px;border:1.5px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sbar .bat::after{content:"";position:absolute;top:1.5px;bottom:1.5px;left:1.5px;width:13px;background:currentColor;border-radius:1px}
.hdr{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px 0 6px}
.hdr h2{font-size:17px;font-weight:700;margin:0;flex:1}
.hdr.big{padding-left:20px}
.hdr.big h2{font-size:22px}
.iconbtn{width:40px;height:40px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--fill)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 28px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.foot{flex:none;padding:10px 20px 26px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.foot.line{border-top:1px solid var(--line)}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding:8px 6px 24px;background:var(--paper)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#9aa0a4;transition:color .15s}
.tabs button.on{color:var(--ink);font-weight:700}
.ic{display:inline-grid;place-items:center;flex:none;line-height:0}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 간격은 관계에 따라: 묶음 안은 촘촘히, 묶음 사이는 넓게 */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column}
.sub{color:var(--sub);font-size:13px;line-height:1.55}
.tiny{font-size:12px;color:var(--sub)}
.acc{color:var(--acc)}
.title{font-size:24px;font-weight:700;line-height:1.38;letter-spacing:-.5px;margin:0;text-wrap:balance}
.title.s{font-size:20px}
.sec{font-size:15px;font-weight:700;margin:0}
.huge{font-size:34px;font-weight:700;letter-spacing:-.8px;line-height:1.15}
.big{font-size:22px;font-weight:700;letter-spacing:-.4px}
.note{font-size:12.5px;color:var(--sub);line-height:1.6;margin:0}
.block{background:var(--fill);border-radius:var(--r);padding:14px 16px}
.kv{display:flex;flex-direction:column;gap:10px;font-size:14px}
.kv .row span:first-child{color:var(--sub)}
.gauge{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.gauge.a i{background:var(--acc)}
.gauge.w i{background:var(--warn)}
.btn{height:52px;border-radius:var(--r);border:0;background:var(--ink);color:#fff;font-weight:600;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;transition:transform .12s,background .15s}
.btn:active{transform:scale(.985)}
.btn.s{background:var(--fill);color:var(--ink)}
.btn.t{background:transparent;color:var(--sub);height:42px;font-weight:500;font-size:14px}
.btn.sm{height:36px;width:auto;padding:0 14px;font-size:13px;border-radius:8px}
.btn[disabled]{background:#cfd4d1;color:#fff}
.link{border:0;background:transparent;padding:0;color:var(--acc);font-weight:600;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--ink2);transition:background .15s,color .15s,border-color .15s}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.tabline{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.tabline button{border:0;background:transparent;padding:10px 0 9px;font-size:14px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabline button.on{color:var(--ink);font-weight:700;border-color:var(--ink)}
.tabline button,.chip{display:inline-flex;align-items:center;gap:6px}
.tabline button:not(.on) .aic{opacity:.5;transition:opacity .15s}
.tag{font-size:11.5px;font-weight:600;color:var(--sub)}
.tag.a{color:var(--acc)}.tag.w{color:var(--warn)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;transition:background .4s}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-size:15px;font-weight:600}
.li.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{0%{background:#e3f1eb}100%{background:transparent}}
.av{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--ink2);flex:none}
.av.lg{width:64px;height:64px;font-size:24px}
.ck{width:22px;height:22px;border-radius:6px;border:1.5px solid #c4cac7;display:grid;place-items:center;flex:none;color:#fff;background:var(--paper);transition:background .15s,border-color .15s,transform .12s;padding:0}
.ck:active{transform:scale(.9)}
.ck.on{background:var(--acc);border-color:var(--acc)}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid #c4cac7;flex:none;transition:border-width .15s,border-color .15s}
.radio.on{border:7px solid var(--ink)}
.tog{width:46px;height:28px;border-radius:14px;background:#d3d8d5;position:relative;border:0;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s cubic-bezier(.3,.7,.3,1)}
.tog.on{background:var(--acc)}
.tog.on::after{left:21px}
.price{font-size:15px;font-weight:700}
.perh{font-size:12px;color:var(--sub)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.steps{display:flex;flex-direction:column;gap:18px}
.step{display:flex;gap:12px;align-items:center;font-size:15px;color:#a3a9ad;transition:color .3s}
.step .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #d3d8d5;flex:none;color:#fff;transition:background .3s,border-color .3s}
.step.ok{color:var(--ink)}
.step.ok .dot{background:var(--acc);border-color:var(--acc)}
.step.now{color:var(--ink);font-weight:600}
.step.now .dot{border-color:var(--acc);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--ink);animation:spin .8s linear infinite}
.drawcheck circle{stroke-dasharray:64;stroke-dashoffset:0}
.drawcheck path{stroke-dasharray:14;stroke-dashoffset:0}
.entering .drawcheck circle{animation:dash1 .5s ease-out both}
.entering .drawcheck path{animation:dash2 .3s .4s ease-out both}
@keyframes dash1{from{stroke-dashoffset:64}}
@keyframes dash2{from{stroke-dashoffset:14}}
.entering .gauge i{animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{width:0}}
.clock{font-size:30px;font-weight:600;letter-spacing:-.5px}
.stars{display:flex;gap:8px;justify-content:center}
.stars button{border:0;background:transparent;color:#d3d8d5;padding:0;transition:color .15s,transform .15s}
.stars button:active{transform:scale(.88)}
.stars button.on{color:#e0a100}
.stars button.on svg{fill:currentColor}
.field{border-bottom:1.5px solid var(--line);padding:12px 2px;display:flex;align-items:center;gap:10px;font-size:16px;transition:border-color .15s}
.field:focus-within{border-color:var(--ink)}
.field input{border:0;outline:0;font:inherit;flex:1;min-width:0;background:transparent;color:var(--ink)}
.search{background:var(--fill);border-radius:var(--r);padding:10px 12px;display:flex;gap:8px;align-items:center;flex:1}
.search input{border:0;outline:0;background:transparent;font:inherit;flex:1;min-width:0;color:var(--ink)}
.stepper{display:flex;align-items:center;justify-content:center;gap:26px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;transition:transform .12s}
.stepper button:active{transform:scale(.9)}
.stepper .v{font-size:40px;font-weight:700;min-width:120px;text-align:center;letter-spacing:-1px}
.stepper .v small{font-size:16px;font-weight:600;margin-left:2px}
.chart{display:flex;align-items:flex-end;gap:10px;height:120px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .c i{display:block;width:100%;border-radius:4px 4px 0 0;background:#d9dddb;transform-origin:bottom}
.chart .c i.on{background:var(--ink)}
.chart .c i.p{background:transparent;border:1.5px dashed #9aa0a4;border-bottom:0}
.chart .c span{font-size:11px;color:var(--sub)}
.chart .c .bt{flex:1 1 0;min-height:0;width:100%;display:flex;align-items:flex-end}
.chart .c .bt i{flex:none}
.scr.keep .sheet,.scr.keep .sheet-bg{animation:none}
.wm{font-size:21px;font-weight:800;letter-spacing:1.5px}
.aic{display:inline-grid;place-items:center;border-radius:28%;color:#fff;font-weight:800;letter-spacing:-.5px;flex:none;line-height:1;vertical-align:middle}
.tag .aic{margin-right:3px;vertical-align:-3px}
.aigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.aitile{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.aitile b{font-size:15px}
.chg-ic{display:flex;justify-content:center;margin-bottom:28px}
.chg-ic .aic{border-radius:26px;box-shadow:0 10px 28px rgba(0,0,0,.14);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.fly{position:absolute;z-index:6;pointer-events:none;will-change:transform,opacity}
.scr.wf .aic{background:#cfcfcf!important;box-shadow:none}.scr.wf .aic path{fill:#8a8a8a}
.aic.lite{box-shadow:inset 0 0 0 1px #e1e4e2}
.splash .aic{box-shadow:0 0 0 1px rgba(255,255,255,.28)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.meta span{display:inline-flex;align-items:center;gap:3px}
.nm{font-size:13px;font-weight:400;color:var(--ink2)}
.off{font-size:12px;font-weight:700;color:var(--acc)}
.tag.bst{color:#7a5a00;background:#fbf1d6;padding:1px 6px;border-radius:4px;font-size:10.5px;vertical-align:2px}
.ri{width:36px;height:36px;border-radius:10px;background:var(--fill);display:grid;place-items:center;color:var(--ink2);flex:none}
.ri.lg{width:56px;height:56px;border-radius:16px}
.hcard{background:var(--fill);border-radius:14px;padding:16px}
.hcard .tag{background:var(--paper);padding:3px 8px;border-radius:6px;color:var(--ink2)}
.plain{width:100%;border:0;background:transparent;padding:0;text-align:left}
.tile{flex:1;display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;text-align:left;min-width:0}
.tile b{font-size:14px;white-space:nowrap}
.mini{border:0;background:transparent;display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--ink2);padding:0}
.boost{border:1px solid var(--line);border-radius:12px;padding:12px;gap:12px;transition:border-color .2s,background .2s}
.boost.on{border-color:var(--acc);background:#f1f8f5}
/* 스플래시 타이포 */
.splash{position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:0 26px 44px;background:var(--ink);color:#fff;overflow:hidden}
.sp-v{position:absolute;right:18px;top:22px;writing-mode:vertical-rl;font-size:70px;font-weight:800;line-height:1;letter-spacing:3px}
.sp-v i{font-style:normal;display:inline-block}
.sp-h{margin:0;display:flex;flex-direction:column;font-size:31px;font-weight:700;letter-spacing:-1px;line-height:1.22}
.sp-h .w{display:block}
.sp-h .big{font-size:64px;letter-spacing:-2px}
.sp-h .l2{color:#5fd3a8}
.sp-ai{display:flex;gap:8px;align-items:center;margin-top:22px}.sp-ai>span:last-child{font-size:13px;color:rgba(255,255,255,.6);margin-left:4px}
.entering .sp-ai .aic{animation:popin .45s 1.05s both}.entering .sp-ai .aic:nth-child(2){animation-delay:1.17s}.entering .sp-ai .aic:nth-child(3){animation-delay:1.29s}
.entering .sp-ai>span:last-child{animation:fadein .4s 1.45s both}
.sp-mq{position:absolute;left:0;right:0;bottom:16px;overflow:hidden;white-space:nowrap;border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14);padding:9px 0;font-size:12.5px;color:rgba(255,255,255,.55)}
.mq-in{display:inline-block;animation:mq 16s linear infinite}
.mq-in span{margin-right:28px}
@keyframes mq{to{transform:translateX(-50%)}}
.entering .sp-v i{animation:vdrop .7s cubic-bezier(.2,.8,.2,1) both}
.entering .sp-v i:nth-child(2){animation-delay:.07s}.entering .sp-v i:nth-child(3){animation-delay:.14s}.entering .sp-v i:nth-child(4){animation-delay:.21s}.entering .sp-v i:nth-child(5){animation-delay:.28s}.entering .sp-v i:nth-child(6){animation-delay:.35s}.entering .sp-v i:nth-child(7){animation-delay:.42s}
@keyframes vdrop{from{transform:translateY(-140%);opacity:0}}
.entering .sp-h .l1{animation:fromL .5s .45s cubic-bezier(.2,.8,.2,1) both}
.entering .sp-h .l2{animation:popin .6s .7s cubic-bezier(.2,.8,.2,1) both}
.entering .sp-h .l3{animation:popin .55s .85s cubic-bezier(.2,.8,.2,1) both}
.entering .sp-h .l4{animation:fromB .5s 1.2s cubic-bezier(.2,.8,.2,1) both}
.entering .sp-h .l5{animation:fromL .5s 1.38s cubic-bezier(.2,.8,.2,1) both}
.entering .sp-h .l6{animation:popin .6s 1.6s cubic-bezier(.2,.8,.2,1) both}
.entering .sp-mq{animation:fadein .6s 1.9s both}
.entering .sp-foot .btn{animation:fromB .5s 1.6s both}
@keyframes fromL{from{transform:translateX(-70px);opacity:0}}
@keyframes fromR{from{transform:translateX(70px);opacity:0}}
@keyframes fromB{from{transform:translateY(30px);opacity:0}}
@keyframes popin{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.scr.wf .splash{background:#e4e4e4;color:#555}.scr.wf .sp-mq{display:none}
.ben{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}

const sortFn=()=>({price:(x,y)=>p10(x.exp)-p10(y.exp)||(y.boost?1:0)-(x.boost?1:0)||x.exp-y.exp||x.cr-y.cr,long:(x,y)=>y.exp-x.exp,big:(x,y)=>y.cr-x.cr||p10(x.exp)-p10(y.exp),rating:(x,y)=>y.rating-x.rating||y.deals-x.deals}[S.sort]);
const passSeller=l=>(!S.fRating||l.rating>=4.5)&&(!S.fDeals||l.deals>=10);
const marketList=()=>pool().filter(l=>l.model===S.model&&inBucket(l)&&passSeller(l)).sort(sortFn());
const searchList=q=>q?pool().filter(l=>l.seller.includes(q)||l.model.toLowerCase().includes(q.toLowerCase())).sort(sortFn()):[];
const filterCount=()=>(S.bucket!=='all')+S.fRating+S.fDeals;

/* 빠른 구매: 기한이 여유 기간 이상인 매물을 싼 순으로 10크레딧씩 채운다 */
function quickFill(model,cr,days){
  const c=pool().filter(l=>l.model===model&&minLeft(l.exp)>=days*1440).sort((a,b)=>p10(a.exp)-p10(b.exp)||(b.boost?1:0)-(a.boost?1:0)||a.exp-b.exp);
  let need=cr;const picks=[];
  for(const l of c){if(need<=0)break;const take=Math.min(l.cr,need);picks.push({id:l.id,cr:take});need-=take;}
  return {picks,short:Math.max(0,need),sum:picks.reduce((s,x)=>s+priceOf(x.cr,byId(x.id).exp),0)};
}
const cartItems=()=>[...S.cart].map(([id,cr])=>{const l=byId(id);return l&&{l,cr,price:priceOf(cr,l.exp)};}).filter(Boolean);
const cartCr=()=>cartItems().reduce((s,x)=>s+x.cr,0);
const cartSum=()=>cartItems().reduce((s,x)=>s+x.price,0);
const payTotal=()=>cartSum();
function fillCart(){S.cart.clear();quickFill(bm(),S.qNeed,S.qDays).picks.forEach(x=>S.cart.set(x.id,x.cr));}
function ensureCart(){if(!S.cart.size&&!S.cartTouched)fillCart();}
const order=()=>S.lastOrder||(()=>{const q=quickFill(bm(),30,2);return {items:q.picks.map(x=>({l:byId(x.id),cr:x.cr,price:priceOf(x.cr,byId(x.id).exp)})),cr:30,sum:q.sum};})();

 </div><div class="foot line"><div class="row"><span class="sub">결제 금액</span><b style="font-size:20px" data-count="${cartSum()}">${won(cartSum())}</b></div><button class="btn mt4" data-go="pay-method">결제 수단 선택</button></div>`;});

 </div><div class="foot"><button class="btn" data-go="pay-confirm">다음</button></div>`;});

  <span class="sub">${bm()} 계정에 ${cartCr()}크레딧 충전</span><div class="huge mt4" data-count="${cartSum()}">${won(cartSum())}</div>
  <div class="kv mt32"><div class="row"><span>크레딧</span><b>${S.cart.size}건, ${bp()} ${cartCr()}%</b></div><div class="row"><span>결제 수단</span><b>${payLabel()}</b></div><div class="row"><span>결제 수수료</span><b>5% 포함</b></div><div class="row"><span>검수</span><b>잔여량 확인 완료</b></div><div class="row"><span>충전 실패 시</span><b>자동 결제 취소</b></div></div>
  <button class="li mt24" data-act="agree" style="border-top:1px solid var(--line)"><span class="ck ${S.agree?'on':''}">${S.agree?I('check',14,'stroke-width:2.6'):''}</span><span class="grow" style="font-size:13.5px">기한이 지나면 남은 양이 소멸됨을 확인했습니다</span></button>
 </div><div class="foot"><button class="btn" data-act="paynow" ${S.agree?'':'disabled'}>결제</button></div>`;});
def('paying','D-11','결제 중','buy',()=>`<div class="body" style="display:flex;flex-direction:column;justify-content:center;align-items:center"><div class="spin"></div><h3 class="title s mt24">결제 중</h3></div>`,{auto:'paying'});

const chgM=()=>{const it=cartItems();return it.length?it[0].l.model:(S.lastOrder&&S.lastOrder.items[0]?S.lastOrder.items[0].l.model:bm());};

  <div class="chg-ic">${aiIc(chgM(),92)}</div>

def('done','D-13','충전 완료','buy',()=>{const o=order();return `${hdr('',{right:`<button class="iconbtn" data-go="home" aria-label="닫기">${I('x',22)}</button>`,back:false})}<div class="body">

  <div class="mt24"><div class="row tiny"><span>${bpn()} 잔여 8%</span><span class="acc">+ 크레셀 ${o.cr}%</span></div><div class="split mt8" style="height:8px"><i style="width:8%;background:var(--ink)"></i><i style="width:${o.cr}%;background:var(--acc)"></i></div></div>
  <div class="kv mt32"><div class="row"><span>판매자</span><b>${sellerSum(o.items.map(x=>x.l.seller))}</b></div><div class="row"><span>기한</span><b>${fShort(secLeft(Math.min(...o.items.map(x=>x.l.exp))))} 뒤부터 순차 소멸</b></div><div class="row"><span>결제</span><b>${won(o.sum)}</b></div></div>
 </div><div class="foot"><button class="btn" data-act="openai">${bm()}에서 이어 쓰기 ${I('ext',16)}</button><button class="btn t" data-go="review">거래 평가</button></div>`;});
def('fail','D-14','충전 실패와 환불','buy',()=>{const o=order();return `${hdr('',{back:false})}<div class="body" style="padding-top:12px">
  <h3 class="title">충전 실패,<br>결제 취소</h3><p class="sub mt12">AI 회사 연동이 응답하지 않았습니다. 크레딧은 판매자에게 반환되었습니다.</p>
  <div class="kv mt32"><div class="row"><span>취소 금액</span><b>${won(o.sum)}</b></div><div class="row"><span>환불</span><b>${payLabel()}, 즉시</b></div></div>
 </div><div class="foot"><button class="btn" data-act="retry">${I('retry',18)}다시 시도</button><button class="btn s" data-go="market">다른 크레딧 선택</button><button class="btn t" data-go="chat" data-topic="late">고객센터 문의</button></div>`;});

/* E. 평가 */
const RTAGS=['빠른 충전','설명과 일치','넉넉한 기한','정확한 양'];
def('review','E-01','거래 평가','buy',()=>{const o=order();return `${hdr('')}<div class="body" style="padding-top:12px">
  <h3 class="title s">${sellerSum(o.items.map(x=>x.l.seller))}<br>거래 평가</h3>
  <div class="stars mt32">${[1,2,3,4,5].map(i=>`<button class="${i<=S.stars?'on':''}" data-act="stars" data-v="${i}" aria-label="${i}점">${I('star',38)}</button>`).join('')}</div>
  <div class="chips mt32" style="justify-content:center">${RTAGS.map(t=>`<button class="chip ${S.tags.has(t)?'on':''}" data-act="tag" data-t="${t}">${t}</button>`).join('')}</div>
  <label class="field mt32"><input id="in-rv" placeholder="한 줄 후기 (선택)" aria-label="후기"></label>
 </div><div class="foot"><button class="btn" data-go="review-done">평가 보내기</button><button class="btn t" data-go="report-issue">문제 신고</button></div>`;});
def('review-done','E-02','평가 완료','buy',()=>`<div class="body" style="display:flex;flex-direction:column;justify-content:center">
  <div class="center">${CHECK(64)}<h3 class="title mt16">평가 완료</h3></div>
  <div class="row mt32" style="padding-top:16px;border-top:1px solid var(--line)"><span><b style="font-size:15px">잔여 10%에서 알림</b><div class="tiny mt4">빠른 구매로 바로 연결</div></span>${tog('notif.limit',S.notif.limit,'한도 임박 알림')}</div>
 </div><div class="foot"><button class="btn" data-go="home">홈</button></div>`);
/* F. 팔기 */
const mineRow=m=>`<button class="li ${m.isNew?'slidein':''}" data-go="sell-detail" data-id="${m.id}"><span class="grow"><span class="t">${m.cr}크레딧${m.boost?' <span class="tag bst">우선 노출</span>':''}</span>${meta(I('clock',12)+left(m.exp),`조회 ${m.views}`)}</span><span style="text-align:right"><b>${won(sellOf(m.cr,m.exp))}</b><div class="perh mt4">10크레딧 ${won(s10(m.exp))}</div></span></button>`;
const soldRow=(s,i)=>`<button class="li" data-go="sale-detail" data-i="${i}"><span class="grow"><span class="t">${s.cr}크레딧 판매</span>${meta(s.date,`${s.buyer} 님`)}</span><span style="text-align:right"><b class="acc">+${won(settleOf(s))}</b><div class="tiny mt4">${s.state}</div></span>${CHEV}</button>`;
def('sell-home','F-01','내놓기 홈','sell',()=>!sellReady()?`${bigHdr('내놓기')}<div class="body" style="display:flex;flex-direction:column;justify-content:center"><div class="center"><span class="ri lg">${I('link',26)}</span><h3 class="title s mt16">구독 중인 AI를 연결하면<br>남는 사용량을 판매합니다</h3><p class="sub mt8">초기화 때 남을 양을 예측해 10% 단위로 판매</p></div></div><div class="foot"><button class="btn" data-go="pick-ai" data-add="1" data-k="sell">AI 연결</button></div>${tabs('sell-home')}`:`${bigHdr('내놓기',`<button class="iconbtn" data-go="auto-sell" aria-label="자동 내놓기">${I('repeat',21)}</button>`)}<div class="body">
  <div class="hcard mt4">
   <div class="row"><span class="tag">${sellPlan()}</span><span class="meta">${I('clock',12)}${left(SELL_EXP)}</span></div>
   <div class="row mt8" style="justify-content:flex-start;align-items:baseline;gap:8px"><span class="huge">${pred().can}%</span><span class="sub" style="font-size:15px">판매 가능 (예측)</span></div>
   <button class="row plain mt8" data-go="predict"><span class="sub">잔여 예측 ${pred().left}%, 10% 단위</span>${I('chev',16,'color:var(--sub)')}</button>
  </div>
  <div class="row mt12" style="gap:8px">
   <button class="tile" data-go="auto-sell"><span class="ri">${I('repeat',18)}</span><span class="col"><b>자동 내놓기</b><span class="tiny ${S.auto.on?'acc':''}">${S.auto.on?`초기화 ${{'3d':'3일','1d':'1일','6h':'6시간'}[S.auto.before]} 전`:'꺼짐'}</span></span></button>
   <button class="tile" data-go="settle"><span class="ri">${I('wallet',18)}</span><span class="col"><b>${won(avail())}</b><span class="tiny">출금 가능</span></span></button>
  </div>

  <div class="list mt4">${S.mine.map(mineRow).join('')||'<p class="sub mt8">판매 중인 크레딧 없음</p>'}</div>
 </div><div class="foot"><button class="btn" data-go="sell-amount">내놓기</button></div>${tabs('sell-home')}`,{tab:true});
def('predict','F-02','사용량 예측 상세','sell',()=>{const P=pred();return `${hdr('')}<div class="body" style="padding-top:12px">
  <span class="sub">${sellPlan()}, 초기화 시 잔여 예측</span><div class="huge mt4"><span data-up="${P.left}" data-unit="%">${P.left}%</span></div><p class="sub mt8">최근 4주 같은 요일 기준${S.mine.length?', 판매 중인 양 제외':''}</p>
  <h3 class="sec mt32">이번 주 하루 사용량</h3><span class="tiny mt4" style="display:block">진한 막대: 실제, 점선: 예측</span>
  ${chart(P.bars.map(v=>[v,1]).concat(P.fut.map(v=>[v,0])),['월','화','수','목','금','토','일'],25,'%')}
  <div class="kv mt24"><div class="row"><span>사용</span><b>${P.used}%</b></div><div class="row"><span>남은 기간 예상 사용</span><b>${P.more}%</b></div><div class="row"><span>판매 가능</span><b class="acc">${P.can}% (10% 단위)</b></div></div>
 </div><div class="foot"><button class="btn" data-act="sellpredict">양 직접 고르기</button></div>`;});
def('sell-amount','F-03','내놓을 양 고르기','sell',()=>{const P=pred();if(S.sellPct>P.max)S.sellPct=P.max;const x=S.sellPct;return `${hdr('')}<div class="body" style="padding-top:12px">
  <h3 class="title">판매할 양</h3><p class="sub mt8">이번 주 일정에 맞춰 직접 고릅니다. 예측은 참고용입니다.</p>
  <div class="row mt16" style="align-items:baseline"><span class="huge"><span data-count="${x}" data-unit="%">${x}%</span></span><span class="sub">${x}크레딧</span></div>
  ${slider('sellPct',10,P.max,10,P.can,'예측')}
  <div class="split mt24" style="height:10px" data-gid="sellsplit"><i style="width:${P.used}%;background:var(--ink)"></i><i style="width:${x}%;background:var(--acc)"></i></div>
  <div class="row mt8 tiny"><span>사용 ${P.used}%</span><span class="acc">판매 ${x}%</span><span>유지 ${100-P.used-x}%</span></div>
  <p class="sub mt24" style="${x>P.can?'color:var(--warn)':''}">${x>P.can?`예측 잔여(${P.left}%)보다 많음. 이번 주 부족 가능.`:x===P.can?`예측 ${P.left}% 중 ${P.can}% 판매, ${P.left-P.can}%는 초기화 시 소멸.`:'예측보다 적게 판매, 여유 있음.'}</p>
  <p class="note mt8">팔리기 전에는 언제든 내릴 수 있습니다. 팔리지 않은 양은 초기화 전 한도로 돌아옵니다.</p>
 </div><div class="foot"><button class="btn" data-go="sell-price">다음</button></div>`;});
/* 우선 노출: 미리 내는 돈 없이, 팔렸을 때만 정산 5%p를 크레셀에 더 낸다 */
def('sell-price','F-04','판매 가격과 우선 노출','sell',()=>{const p=s10(SELL_EXP),t=S.sellPct/10*p,r=sellRate();return `${hdr('')}<div class="body" style="padding-top:12px">
  <span class="sub">판매 가격, 크레셀 결정</span><div class="huge mt4">10크레딧 ${won(p)}</div>
  <p class="sub mt8">남은 기간이 줄면 자동으로 내려갑니다.</p>
  <div class="mt16">${ladder(SELL_EXP,1)}</div>
  <p class="tiny mt8">장터에는 결제 수수료 5%를 더한 10크레딧 ${won(p10(SELL_EXP))}으로 표시됩니다. 정산은 판매 가격 기준입니다.</p>
  <p class="tiny mt12">현재 1~3일 구간. ${left(SELL_EXP-1440)} 뒤 470원 적용.</p>
  <div class="row mt24 boost ${S.boost?'on':''}"><span class="ri">${I('trendup',19)}</span><span class="grow"><b style="font-size:15px">우선 노출</b><div class="tiny mt4">같은 가격 구간 맨 위, 빠른 구매 우선 배정<br>팔린 경우에만 정산 5%p 차감</div></span>${tog('boost',S.boost,'우선 노출')}</div>
  <div class="kv mt24"><div class="row"><span>판매가 (${S.sellPct}크레딧)</span><b>${won(t)}</b></div><div class="row"><span>AI 회사 30%</span><span>-${won(t*.3)}</span></div><div class="row"><span>크레셀 ${S.boost?15:10}%</span><span data-count="${Math.round(t*(.4-(r-.6)-.3))}">-${won(t*(.4-(r-.6)-.3))}</span></div><div class="row" style="padding-top:10px;border-top:1px solid var(--line)"><span style="color:var(--ink);font-weight:600">내 정산 ${Math.round(r*100)}%</span><b class="big acc" data-count="${Math.round(t*r)}">${won(t*r)}</b></div></div>
  <p class="note mt16">최저가는 정가의 70%인 470원입니다. AI 회사와 정한 하한입니다.</p>
 </div><div class="foot"><button class="btn" data-go="sell-confirm">다음</button></div>`;});
def('sell-confirm','F-05','등록 확인','sell',()=>{const t=S.sellPct/10*s10(SELL_EXP);return `${hdr('')}<div class="body" style="padding-top:12px">
  <span class="sub">${sm()} 크레딧 판매</span><div class="huge mt4">${S.sellPct}크레딧, ${won(t)}</div>
  <div class="kv mt32"><div class="row"><span>요금제 기준</span><b>${planPct(sm(),S.sellPct)}</b></div><div class="row"><span>기한</span><b>초기화 시각까지</b></div><div class="row"><span>가격</span><b>남은 기간에 따라 자동</b></div><div class="row"><span>우선 노출</span><b>${S.boost?'켜짐':'꺼짐'}</b></div><div class="row"><span>판매자</span><b>${ME}</b></div><div class="row"><span>정산 예상</span><b class="acc">${won(t*sellRate())}</b></div></div>
  <p class="note mt24">등록 시 AI 회사 연동으로 잔여량을 확인한 뒤 장터에 표시합니다. 약 1분 소요.</p>
 </div><div class="foot"><button class="btn" data-act="sellpost">장터에 등록</button></div>`;});
const mktOrder=(x,y)=>p10(x.exp)-p10(y.exp)||(y.boost?1:0)-(x.boost?1:0)||x.exp-y.exp;
def('sell-done','F-06','등록 완료','sell',()=>{const m=S.lastPost||{cr:S.sellPct,exp:SELL_EXP,boost:S.boost};return `<div class="body" style="display:flex;flex-direction:column;justify-content:center">
  <div class="scene"><div class="tiny" style="padding:0 14px 8px">${sm()} 장터, 싼 순</div>
   ${(()=>{const L=pool().filter(l=>l.model===sm()).sort(mktOrder),k=L.findIndex(l=>mktOrder(m,l)<0),i=k<0?L.length:k,bef=L.slice(Math.max(0,i-2),i),aft=L.slice(i,i+2),row=(l,c)=>`<div class="mrow ${c}"><span>${l.seller} ${l.cr}크레딧</span><b>${won(priceOf(l.cr,l.exp))}</b></div>`;

  document.body.style.cssText=opt.view?'margin:0;padding:0;overflow:hidden':`margin:0;padding:0;background:#f5f5f5;width:${BW}px`;
  const b=document.createElement('div');b.className='board';b.style.cssText=`width:${BW}px;height:${BH}px`;
  b.innerHTML=all?`<div style="position:absolute;left:${PX}px;top:44px"><div style="font-size:34px;font-weight:800;color:#111">크레셀 전체 흐름도 <span style="font-size:20px;color:#646b6f;font-weight:600">화면 ${MAIN.length}개, 한 장</span></div><div style="font-size:16px;color:#555;margin-top:8px">한 줄이 한 묶음(A~X). 선은 누르는 곳(동그라미)에서 이동하는 화면(화살촉)으로, 화면 사이 빈칸만 따라 이어짐. 남색은 같은 묶음 안, 회청색은 다른 묶음으로 가는 선, 점선은 자동 전환</div></div>`
   :`<div style="position:absolute;left:${PX}px;top:44px"><div style="font-size:30px;font-weight:700;color:#111">${G[g]}</div><div style="font-size:15px;color:#666;margin-top:6px">크레셀 와이어프레임 흐름도. 선은 누르는 곳에서 이동하는 화면으로 화면 사이 빈칸을 따라 이어짐. 점선은 자동 전환, 남색 꼬리표는 다른 묶음으로 가는 링크</div></div>`;
  let host=document.body;
  if(opt.view){host=document.createElement('div');host.className='bview';document.body.appendChild(host);}
  host.appendChild(b);
  if(all)GK.forEach((k,r)=>{const d=document.createElement('div');d.className='glabel';d.style.cssText=`left:30px;top:${PY+r*(H+46+GY)+36}px;width:${PX-190}px;white-space:normal`;const n=MAIN.filter(s=>s.code[0]===k).length;d.innerHTML=`${G[k].split('. ')[0]}<span>${G[k].split('. ')[1]}<br>${n}개</span>`;b.appendChild(d);});
  const pos={};
  list.forEach(s=>{const [col,row]=cell(s),x=PX+col*(W+GX),y=PY+row*(H+46+GY);pos[s.id]={x,y:y+36,top:y,col,row};
    const c=document.createElement('div');c.className='bcard';c.style.cssText=`left:${x}px;top:${y}px`;
    cur=s.id;param={};
    c.innerHTML=`<div class="bl"><code>${s.code}</code>${s.name}</div><div class="bf"><div class="scr${S.wf?' wf':''}${s.dark&&(S.wf||!s.darkbg)?' lockbg':''}" style="${s.darkbg&&!S.wf?'background:'+s.darkbg:''}">${sbar(s.dark)}<div class="view">${s.render({})}</div></div></div>`;
    c.dataset.sid=s.id;b.appendChild(c);});
  const NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');svg.setAttribute('width',BW);svg.setAttribute('height',BH);svg.style.cssText='position:absolute;left:0;top:0;pointer-events:none;z-index:2';
  svg.innerHTML='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2a4d"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f84a8"/></marker></defs>';
  b.appendChild(svg);const br=b.getBoundingClientRect(),seen=new Set();
  /* 직각 연결선: 화면 위를 지나지 않고 열 사이 빈칸(세로 길)과 행 사이 빈칸(가로 길)으로만 다닌다. 선마다 길 안의 자리를 따로 받아 겹치지 않게 한다 */
  const vUse={},hUse={},inUse={};
  const gL=c=>c<0?(all?PX-150:0):PX+c*(W+GX)+W,gR=c=>c>=COLS-1?BW:PX+(c+1)*(W+GX);
  const laneX=c=>{const k=vUse[c]=(vUse[c]||0)+1,l=gL(c),w=gR(c)-l,n=Math.max(1,Math.floor((w-40)/13));return l+20+((k-1)%n)*13;};
  const laneY=r=>{const k=hUse[r]=(hUse[r]||0)+1,bot=PY+r*(H+46+GY)-8,top=r?bot-GY+20:bot-60,n=Math.max(1,Math.floor((bot-top)/11));return bot-((k-1)%n)*11;};
  const entry=t=>{const k=inUse[t]=(inUse[t]||0)+1;return pos[t].y+40+((k-1)%14)*30;};
  const line=(x1,y1,src,t,dash)=>{const S0=pos[src],T=pos[t],ey=entry(t),tx=T.x-2,xs=laneX(S0.col);let pts;
    if(T.col===S0.col+1)pts=[[x1,y1],[xs,y1],[xs,ey],[tx,ey]];
    else{const hy=laneY(T.row),xt=laneX(T.col-1);pts=[[x1,y1],[xs,y1],[xs,hy],[xt,hy],[xt,ey],[tx,ey]];}
    const p=document.createElementNS(NS,'path');p.setAttribute('d','M'+pts.map(q=>q.join(' ')).join(' L'));
    const far=S0.row!==T.row&&all,col=far?'#6f84a8':'#1f2a4d';
    p.setAttribute('fill','none');p.setAttribute('stroke',col);p.setAttribute('stroke-width','2');p.setAttribute('stroke-linejoin','round');p.setAttribute('marker-end',far?'url(#ah2)':'url(#ah)');if(dash)p.setAttribute('stroke-dasharray','7 6');p.dataset.s=src;p.dataset.t=t;svg.appendChild(p);
    const o=document.createElementNS(NS,'circle');o.setAttribute('cx',x1);o.setAttribute('cy',y1);o.setAttribute('r','4.5');o.setAttribute('fill','#fff');o.setAttribute('stroke',col);o.setAttribute('stroke-width','2');o.dataset.s=src;o.dataset.t=t;svg.appendChild(o);};
  b.querySelectorAll('.bcard').forEach(card=>{const sid=card.dataset.sid;
    (card.querySelector('.sheet')||card).querySelectorAll('[data-go],[data-act]').forEach(el=>{if(el.closest('.tabs')||el.dataset.tab||el.dataset.act==='back')return;
      let t=el.dataset.go||ACTGO[el.dataset.act];if(!t||t===sid)return;
      const key=sid+'>'+t;if(seen.has(key))return;seen.add(key);
      const r=el.getBoundingClientRect();if(!r.width)return;const x1=r.right-br.left-4,y1=r.top-br.top+r.height/2;
      if(pos[t]){line(x1,y1,sid,t);}
      else{const ts=SC.find(s=>s.id===t);if(!ts)return;const tg=document.createElement('span');tg.className='btag';tg.textContent='→ '+ts.code;tg.style.left=(x1+6)+'px';tg.style.top=(y1-10)+'px';b.appendChild(tg);}});
    if(AUTO[sid]&&pos[AUTO[sid]]){const r=card.getBoundingClientRect();line(r.right-br.left,r.top-br.top+H/2,sid,AUTO[sid],true);}});
  window.__board={w:BW,h:BH,cards:b.querySelectorAll('.bcard').length,lines:svg.querySelectorAll('path').length,tags:b.querySelectorAll('.btag').length};
  cur=keep[0];param=keep[1];
  if(opt.view)boardView(host,b,BW,BH,all,opt);
}
/* 한 화면 흐름도 보기: 확대 축소, 이동, 미니맵, 화면 누르면 프로토타입으로 */
function boardView(host,b,BW,BH,all,opt){
  let k=1,tx=0,ty=0;
  const tool=document.createElement('div');tool.className='btool';
  tool.innerHTML=`<b>크레셀 전체 흐름도</b><button type="button" data-z="fit">전체 맞춤</button><button type="button" data-z="out" aria-label="축소">-</button><span class="zv"></span><button type="button" data-z="in" aria-label="확대">+</button><span class="sep"></span>${Object.keys(G).map((g,r)=>`<button type="button" data-row="${r}">${g}</button>`).join('')}<span class="sep"></span><button type="button" data-v="ui" aria-pressed="${!opt.wf}">완성 화면</button><button type="button" data-v="wf" aria-pressed="${!!opt.wf}">와이어</button><span class="sep"></span><button type="button" data-v="proto">프로토타입으로</button>`;
  document.body.appendChild(tool);
  const hint=document.createElement('div');hint.className='bhint';hint.textContent='끌어서 이동, 휠이나 두 손가락으로 확대, 화면을 누르면 그 화면부터 시연';document.body.appendChild(hint);
  const MW=innerWidth<700?96:190,mk=MW/BW,mini=document.createElement('div');mini.className='bmini';mini.style.cssText=`width:${MW}px;height:${Math.round(BH*mk)}px`;
  b.querySelectorAll('.bcard').forEach(c=>{const i=document.createElement('i');i.style.cssText=`left:${c.offsetLeft*mk}px;top:${c.offsetTop*mk}px;width:${390*mk}px;height:${860*mk}px`;mini.appendChild(i);});
  const vp=document.createElement('div');vp.className='vp';mini.appendChild(vp);document.body.appendChild(mini);
  const apply=()=>{b.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;tool.querySelector('.zv').textContent=Math.round(k*100)+'%';
    vp.style.cssText=`left:${-tx/k*mk}px;top:${-ty/k*mk}px;width:${innerWidth/k*mk}px;height:${innerHeight/k*mk}px`;};
  const fitAll=()=>{const top=tool.offsetHeight+24;k=Math.min((innerWidth-24)/BW,(innerHeight-top-12)/BH);tx=(innerWidth-BW*k)/2;ty=top;apply();};
  const zoomAt=(f,cx,cy)=>{const nk=Math.min(2,Math.max(.03,k*f));tx=cx-(cx-tx)*nk/k;ty=cy-(cy-ty)*nk/k;k=nk;apply();};
  const goRow=r=>{const y=240+r*(824+46+300);k=Math.max(k,Math.min(.45,innerWidth/(BW*.6)));tx=-300*k+12;ty=-(y-40)*k+tool.offsetHeight+24;apply();};
  const exit=sid=>{const u=location.pathname+'#'+(sid||cur);if(window.__shell&&!new URLSearchParams(location.search).get('board')){host.remove();tool.remove();hint.remove();mini.remove();document.body.style.cssText='';document.body.appendChild(window.__shell);window.__still=false;S.wf=!!opt.wfBack;stack=[];if(sid){cur=sid;param={};if(sid==='chat')chatStart('home');}render('jump');fit();}else location.href=u;};
  tool.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
    if(t.dataset.z==='fit')fitAll();if(t.dataset.z==='in')zoomAt(1.25,innerWidth/2,innerHeight/2);if(t.dataset.z==='out')zoomAt(.8,innerWidth/2,innerHeight/2);
    if(t.dataset.row)goRow(+t.dataset.row);
    if(t.dataset.v==='proto')exit();
    if(t.dataset.v==='ui'||t.dataset.v==='wf'){const wf=t.dataset.v==='wf';if(wf===!!opt.wf)return;host.remove();tool.remove();hint.remove();mini.remove();buildBoard('all',{view:true,wf,wfBack:opt.wfBack});}});
  mini.addEventListener('pointerdown',e=>{const r=mini.getBoundingClientRect(),x=(e.clientX-r.left)/mk,y=(e.clientY-r.top)/mk;tx=innerWidth/2-x*k;ty=innerHeight/2-y*k;apply();e.stopPropagation();});
  host.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX,e.clientY);},{passive:false});
  const pts=new Map();let moved=0,last=null,pinch=null;
  host.addEventListener('pointerdown',e=>{host.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=0;host.classList.add('drag');
    if(pts.size===2){const [a,c]=[...pts.values()];pinch={d:Math.hypot(a[0]-c[0],a[1]-c[1]),k};}last=[e.clientX,e.clientY];});
  host.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p0=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2&&pinch){const [a,c]=[...pts.values()],d=Math.hypot(a[0]-c[0],a[1]-c[1]),cx=(a[0]+c[0])/2,cy=(a[1]+c[1])/2;zoomAt(pinch.k*d/pinch.d/k,cx,cy);moved+=99;return;}
    const dx=e.clientX-p0[0],dy=e.clientY-p0[1];moved+=Math.abs(dx)+Math.abs(dy);tx+=dx;ty+=dy;apply();});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)host.classList.remove('drag');
    if(e.type==='pointerup'&&moved<6&&!pts.size){const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest('.bcard');if(c)exit(c.dataset.sid);}};
  host.addEventListener('pointerup',up);host.addEventListener('pointercancel',up);
  /* 화면에 올리면 그 화면에서 나가고 들어오는 선만 진하게 */
  b.addEventListener('pointerover',e=>{const c=e.target.closest('.bcard');if(!c||pts.size)return;const id=c.dataset.sid;host.classList.add('focus');
    b.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));c.classList.add('on');
    b.querySelectorAll('svg path,svg circle').forEach(x=>{if(x.dataset.s===id||x.dataset.t===id){x.classList.add('on');const o=b.querySelector(`.bcard[data-sid="${x.dataset.s===id?x.dataset.t:x.dataset.s}"]`);if(o)o.classList.add('on');}});});
  b.addEventListener('pointerleave',()=>{host.classList.remove('focus');b.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));});
  addEventListener('resize',apply);
  fitAll();window.__bv={fit:fitAll,state:()=>({k,tx,ty})};
}

/* 패널 */
const qs=new URLSearchParams(location.search);
/* 폰과 태블릿(손가락으로 쓰는 기기)이나 좁은 화면에서는 폰 모양 없이 화면 전체가 앱. PC는 폰 모양 그대로. ?frame=1 이면 어디서든 폰 모양 */
try{const mobile=matchMedia('(pointer: coarse)').matches||innerWidth<700;
  if(qs.get('frame')!=='1'&&(qs.get('app')==='1'||mobile||matchMedia('(display-mode: standalone)').matches||navigator.standalone))document.documentElement.classList.add('app');}catch(e){}
if(qs.get('board')){const bg=qs.get('board');if(bg==='all'&&!qs.get('cap'))buildBoard('all',{view:true,wf:qs.get('wf')==='1'});else buildBoard(bg,{wf:qs.get('wf')==='1'});return;}
const idx=document.getElementById('idx'),sel=document.getElementById('mobsel');
idx.innerHTML=Object.keys(G).map(k=>`<div><h3>${G[k]} <span style="font-weight:400">${MAIN.filter(s=>s.code[0]===k).length}</span></h3>${MAIN.filter(s=>s.code[0]===k).map(s=>`<button type="button" data-id="${s.id}"><code>${s.code}</code><span>${s.name}</span></button>`).join('')}</div>`).join('');
sel.innerHTML=MAIN.map(s=>`<option value="${s.id}">${s.code} ${s.name}</option>`).join('');
const jump=id=>{stack=[];if(id==='chat')chatStart('home');cur=id;param={};render('jump');};
idx.addEventListener('click',e=>{const b=e.target.closest('button');if(b)jump(b.dataset.id);});
sel.addEventListener('change',()=>jump(sel.value));
const setPressed=(a,b,v)=>{document.getElementById(a).setAttribute('aria-pressed',v);document.getElementById(b).setAttribute('aria-pressed',!v);};
document.getElementById('v-ui').onclick=()=>{S.wf=false;setPressed('v-ui','v-wf',true);render('jump');};
document.getElementById('v-wf').onclick=()=>{S.wf=true;setPressed('v-ui','v-wf',false);render('jump');};
document.getElementById('v-all').onclick=()=>{const keep=[cur,param,S.wf];buildBoard('all',{view:true,wf:S.wf,wfBack:S.wf});};
const ord=MAIN.map(s=>s.id);
document.getElementById('prev').onclick=()=>{const i=ord.indexOf(cur);stack=[];const id=ord[(i-1+ord.length)%ord.length];if(id==='chat')chatStart('home');cur=id;param={};render('back');};
document.getElementById('next').onclick=()=>{const i=ord.indexOf(cur);stack=[];const id=ord[(i+1)%ord.length];if(id==='chat')chatStart('home');cur=id;param={};render('fwd');};
document.getElementById('restart').onclick=()=>{freshState();clearTimeout(timer);stack=[];S.t=0;go('splash',{},true);toast('초기화 완료. 새 고객 상태로 시작');};

/* 폰 크기 맞추기 */
function fit(){const f=document.getElementById('fit');
  if(document.documentElement.classList.contains('app')){const ph=document.getElementById('phone'),k=Math.min(innerWidth/390,innerHeight/760),w=Math.min(innerWidth/k,520);ph.style.width=w+'px';ph.style.height=(innerHeight/k)+'px';ph.style.transform=`scale(${k})`;f.style.height=innerHeight+'px';f.style.marginLeft=((innerWidth-w*k)/2)+'px';return;}
  const w=f.clientWidth;let k=Math.min(1,w/390);if(innerWidth>900)k=Math.min(k,Math.max(.62,(innerHeight-120)/844));document.getElementById('phone').style.transform=`scale(${k})`;f.style.height=(844*k)+'px';}
addEventListener('resize',fit);fit();

/* 캡처용: 시간을 멈추고 화면을 바로 띄움 */
window.cresell={go:id=>{window.__still=true;stack=[];S.t=0;if(id==='chat')chatStart('home');cur=id;param={};render('none');},list:()=>MAIN.map(s=>[s.id,s.code,s.name]),wf:v=>{S.wf=v;render('none');}};
const h=location.hash.slice(1); if(h&&SC.find(s=>s.id===h)){cur=h;if(h==='chat')chatStart('home');}
render('jump');
const canBack=()=>{const s=SC.find(x=>x.id===cur);return !!(s&&s.sheet)||stack.length>0||!!PARENT[cur];};
try{history.pushState({cr:1},'',location.href);addEventListener('popstate',()=>{if(!document.getElementById('scr').isConnected)return;if(canBack()){back();history.pushState({cr:1},'',location.href);}else history.back();});}catch(e){}
})();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
